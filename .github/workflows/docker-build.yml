name: Docker Build & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐳 Construir la imagen Docker
        run: docker build -t mi-app-docker:latest .

      - name: ✅ Ejecutar contenedor y probar endpoint /health
        run: |
          docker run -d -p 5000:5000 --name test-app mi-app-docker:latest
          sleep 5
          echo "Probando endpoint /health..."
          curl -f http://localhost:5000/health
          echo "✅ ¡Prueba exitosa!"
          docker logs test-app

      - name: 🧹 Limpiar contenedor
        if: always()
        run: docker stop test-app || true